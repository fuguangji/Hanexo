name: Build HANEXO

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanexo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build HANEXO
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout HANEXO source
        uses: actions/checkout@v4

      - name: Check whether the application is ready
        id: app
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json does not exist yet. Build skipped."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.app.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run simulation tests
        if: steps.app.outputs.ready == 'true'
        run: npm test

      - name: Build production site
        if: steps.app.outputs.ready == 'true'
        run: npm run build

      - name: Verify build output
        if: steps.app.outputs.ready == 'true'
        shell: bash
        run: |
          test -s dist/index.html || {
            echo "::error::Build output is missing dist/index.html."
            exit 1
          }

      - name: Upload production build
        if: steps.app.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hanexo-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

name: Build and Deploy HANEXO

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanexo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build HANEXO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout HANEXO source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Run simulation tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify GitHub Pages build
        shell: bash
        run: |
          test -s dist/index.html || {
            echo "::error::Build output is missing dist/index.html."
            exit 1
          }
          test -d dist/assets || {
            echo "::error::Build output is missing dist/assets."
            exit 1
          }
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy HANEXO to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
